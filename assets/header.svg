<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00e5ff" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12203a" stroke-width="1"/></pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.l{opacity:0}.l1{opacity:1}
.l{animation:show 12s infinite}
.l2{animation-delay:4s}.l3{animation-delay:8s}.l1{animation-delay:0s}
@keyframes show{0%{opacity:0}3%,28%{opacity:1}33%,100%{opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>

<rect width="1200" height="340" fill="#070b14"/>
<rect width="1200" height="340" fill="url(#grid)" opacity=".6"/>
<radialGradient id="rg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
<circle cx="985" cy="170" r="320" fill="url(#rg)"/>
<g transform="translate(985 170)" fill="none">
  <circle r="150" stroke="#00e5ff" stroke-opacity=".35" stroke-dasharray="2 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/></circle>
  <circle r="120" stroke="#ff2bd6" stroke-width="2" stroke-opacity=".8" stroke-dasharray="70 40 20 40"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite"/></circle>
  <circle r="90" stroke="#00e5ff" stroke-width="3" stroke-opacity=".9" stroke-dasharray="120 60"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></circle>
  <circle r="58" fill="#0c1322" stroke="#00e5ff" stroke-opacity=".8" filter="url(#glow)"/>
  <text y="16" text-anchor="middle" font-size="46" font-weight="800" fill="url(#g)" stroke="none">AI</text>
</g>
<text x="1140" y="44" text-anchor="end" font-size="13" fill="#8196b5" letter-spacing="2">LOC // BHUBANESWAR, IN</text>
<circle class="pulse" cx="66" cy="62" r="5" fill="#39ff88"/>
<text x="82" y="67" font-size="14" fill="#39ff88" letter-spacing="3">SYSTEM ONLINE</text>
<text x="240" y="67" font-size="14" fill="#8196b5" letter-spacing="2">// bikash-kumar-dev</text>
<text x="60" y="150" font-size="60" font-weight="800" fill="url(#g)" filter="url(#glow)" letter-spacing="1">BIKASH KUMAR NAIK</text>
<text x="62" y="198" font-size="22" fill="#e6f1ff" letter-spacing="5">AI ENGINEER <tspan fill="#ff2bd6">//</tspan> SOFTWARE ENGINEER</text>
<g font-size="20" fill="#00e5ff">
 <text class="l l1" x="62" y="260">&gt; building multi-agent systems that ship▌</text>
 <text class="l l2" x="62" y="260">&gt; making LLM output fast and trustworthy▌</text>
 <text class="l l3" x="62" y="260">&gt; python · langgraph · mcp · fastapi▌</text>
</g>
<rect x="0" y="318" width="1200" height="1" fill="#1b2a44"/>
<rect x="0" y="317" width="220" height="3" fill="url(#g)"><animate attributeName="x" from="-220" to="1200" dur="5s" repeatCount="indefinite"/></rect>
<path d="M20 36V20H36 M1164 20H1180V36 M20 296V312H36 M1164 312H1180V296" stroke="#00e5ff" stroke-width="2" fill="none" opacity=".7"/>

</svg>